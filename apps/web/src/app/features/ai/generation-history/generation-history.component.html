<div class="flex flex-col gap-3">
  <h1 class="text-lg font-extrabold tracking-tight text-n900">Historial de generación IA</h1>

  @if (errorMessage()) {
    <div class="rounded-card border border-hard-text/20 bg-hard-bg px-4 py-3 text-sm text-hard-text">
      {{ errorMessage() }}
      <button type="button" class="ml-2 font-bold underline" (click)="retry()">Reintentar</button>
    </div>
  }

  @if (loading()) {
    <div data-testid="loading-indicator" class="flex flex-col gap-3">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <div class="h-16 animate-pulse rounded-card bg-n100"></div>
      }
    </div>
  }

  @if (!loading() && jobs().length === 0 && !errorMessage()) {
    <div data-testid="history-empty">
      <ui-empty-state
        icon="sparkles"
        message="Todavía no generaste nada — cuando inicies una generación con IA, aparecerá aquí en vivo mientras corre, y luego como historial."
      ></ui-empty-state>
    </div>
  }

  @for (job of jobs(); track job.id) {
    <!-- Fila de lista clickeable de ancho completo (ui-tag + timestamp alineado a la
         derecha) — <button> crudo a propósito, no el primitivo del design system, mismo
         patrón que `retry-history-item` en generation-job-detail. -->
    <button
      type="button"
      data-testid="job-row"
      class="flex w-full cursor-pointer items-center gap-3 rounded-card border border-n200 bg-surface p-3 text-left hover:border-primary-300 focus:outline-none focus:ring-2 focus:ring-primary-300"
      (click)="open(job)"
    >
      <ui-tag [variant]="statusTag(job.status)">{{ statusLabel(job.status) }}</ui-tag>
      <div class="flex-1 text-sm text-n800">
        <div data-testid="job-title" class="font-bold">{{ job.topicName }} · {{ job.courseName }}</div>
        <div class="text-n600">
          {{ job.createdCount }}/{{ job.count }} preguntas
          @if (job.failedCount > 0) {
            <span class="text-n500"> · {{ job.failedCount }} fallidas</span>
          }
          @if (job.attemptCount > 1) {
            <span data-testid="attempt-count" class="text-n500"> · {{ job.attemptCount }} intentos</span>
          }
        </div>
      </div>
      <span class="text-xs text-n500">{{ job.createdAt | date: 'short' }}</span>
    </button>
  }

  <ui-pagination [page]="page()" [pageSize]="PAGE_SIZE" [total]="total()" (pageChange)="onPageChange($event)"></ui-pagination>
</div>
