<div class="mx-auto max-w-2xl">
  <h1 class="mb-4 text-xl font-bold text-n900">Nueva pregunta</h1>

  <div class="mb-4 flex gap-1 border-b border-n200">
    <button
      type="button"
      data-testid="tab-photo"
      class="px-4 py-2 text-sm font-medium"
      [class.border-b-2]="tab() === 'photo'"
      [class.border-primary-500]="tab() === 'photo'"
      [class.text-primary-700]="tab() === 'photo'"
      [class.text-n500]="tab() !== 'photo'"
      (click)="setTab('photo')"
    >Foto de la pregunta</button>
    <button
      type="button"
      data-testid="tab-structured"
      class="px-4 py-2 text-sm font-medium"
      [class.border-b-2]="tab() === 'structured'"
      [class.border-primary-500]="tab() === 'structured'"
      [class.text-primary-700]="tab() === 'structured'"
      [class.text-n500]="tab() !== 'structured'"
      (click)="setTab('structured')"
    >Escribir pregunta</button>
  </div>

  @if (saveError()) {
    <p data-testid="save-error" class="mb-3 rounded-field bg-hard-bg px-3 py-2 text-sm text-hard-text" role="alert">{{ saveError() }}</p>
  }

  @if (tab() === 'photo') {
    <div data-testid="tab-photo-panel" class="flex flex-col gap-3 rounded-card border border-n200 bg-surface p-4">
      <div data-testid="photo-grade-select">
        <ui-select label="Grado" [options]="gradeLevelOptions" [value]="pGradeLevel()" (valueChange)="pGradeLevel.set($event)" placeholder="Elige un grado"></ui-select>
      </div>
      <div data-testid="photo-course-select">
        <ui-select
          label="Curso"
          [placeholder]="pGradeLevel() ? 'Elige un curso' : 'Primero elige un grado'"
          [options]="pCourseOptions()"
          [value]="pCourseId()"
          [disabled]="!pGradeLevel()"
          (valueChange)="pCourseId.set($event ?? '')"
        ></ui-select>
      </div>
      <div data-testid="photo-topic-select">
        <ui-select
          label="Tema"
          [placeholder]="pCourseId() ? 'Elige un tema' : 'Primero elige un curso'"
          [options]="pTopicOptions()"
          [value]="pTopicId()"
          [disabled]="!pCourseId()"
          (valueChange)="pTopicId.set($event ?? '')"
        ></ui-select>
      </div>
      <ui-select label="Nivel" [options]="difficultyOptions" [value]="pDifficulty()" (valueChange)="pDifficulty.set($event)" placeholder="Elige"></ui-select>
      <ui-input label="Clave (respuesta correcta)" [value]="pCorrectAnswer()" (valueChange)="pCorrectAnswer.set($event)"></ui-input>

      <div data-testid="image-upload" class="flex flex-col gap-2">
        <span class="text-sm font-medium text-n700">Imagen del enunciado</span>
        <label
          class="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-card border-2 border-dashed border-n300 bg-n50 px-4 py-6 text-center transition-colors hover:border-primary-400 hover:bg-primary-50"
        >
          <input type="file" accept="image/*" class="sr-only" (change)="onImageSelected($event)" />
          @if (pImagePreviewUrl()) {
            <img
              data-testid="image-upload-preview"
              [src]="pImagePreviewUrl()"
              alt="Vista previa de la imagen del enunciado"
              class="h-24 w-24 rounded-field object-cover"
            />
            <span data-testid="image-upload-filename" class="flex items-center gap-1.5 text-sm font-medium text-n900">
              <lucide-angular name="image" class="h-4 w-4 text-primary-500"></lucide-angular>
              {{ pImage()?.name }}
            </span>
            <span data-testid="image-upload-change" class="text-sm font-medium text-primary-500">Cambiar imagen</span>
          } @else {
            <lucide-angular name="upload" class="h-6 w-6 text-n500"></lucide-angular>
            <span class="text-sm text-n700">Arrastra una imagen o haz clic para elegirla</span>
            <span class="text-xs text-n500">PNG o JPG</span>
          }
        </label>
      </div>

      @if (extractError()) {
        <p data-testid="extract-error" class="rounded-field bg-hard-bg px-3 py-2 text-sm text-hard-text" role="alert">{{ extractError() }}</p>
      }
      <div class="flex flex-wrap gap-2">
        <div data-testid="photo-submit"><ui-button variant="primary" [loading]="saving()" (clicked)="submitPhoto()">Guardar pregunta</ui-button></div>
        <div data-testid="extract-with-ai">
          <ui-button variant="ghost" [loading]="extracting()" [disabled]="!photoTaxonomyValid() || extracting()" (clicked)="extractWithAi()">
            <span class="flex items-center gap-1">
              <lucide-angular name="sparkles" class="h-4 w-4"></lucide-angular>
              Extraer con IA
            </span>
          </ui-button>
        </div>
      </div>
    </div>
  } @else {
    <div data-testid="tab-structured-panel" class="flex flex-col gap-3 rounded-card border border-n200 bg-surface p-4">
      <div data-testid="structured-grade-select">
        <ui-select label="Grado" [options]="gradeLevelOptions" [value]="sGradeLevel()" (valueChange)="sGradeLevel.set($event)" placeholder="Elige un grado"></ui-select>
      </div>
      <div data-testid="structured-course-select">
        <ui-select
          label="Curso"
          [placeholder]="sGradeLevel() ? 'Elige un curso' : 'Primero elige un grado'"
          [options]="sCourseOptions()"
          [value]="sCourseId()"
          [disabled]="!sGradeLevel()"
          (valueChange)="sCourseId.set($event ?? '')"
        ></ui-select>
      </div>
      <div data-testid="structured-topic-select">
        <ui-select
          label="Tema"
          [placeholder]="sCourseId() ? 'Elige un tema' : 'Primero elige un curso'"
          [options]="sTopicOptions()"
          [value]="sTopicId()"
          [disabled]="!sCourseId()"
          (valueChange)="sTopicId.set($event ?? '')"
        ></ui-select>
      </div>
      <ui-select label="Nivel" [options]="difficultyOptions" [value]="sDifficulty()" (valueChange)="sDifficulty.set($event)" placeholder="Elige"></ui-select>
      <label class="text-sm text-n700">Enunciado
        <textarea class="mt-1 block w-full rounded-field border border-n200 p-2 text-sm" rows="3" [value]="sBody()" (input)="sBody.set($any($event.target).value)"></textarea>
      </label>
      <label class="text-sm text-n700">Alternativas (una por línea)
        <textarea class="mt-1 block w-full rounded-field border border-n200 p-2 text-sm" rows="4" [value]="sAlternatives()" (input)="sAlternatives.set($any($event.target).value)"></textarea>
      </label>
      <ui-input label="Clave (a/b/c/d)" [value]="sCorrectAnswer()" (valueChange)="sCorrectAnswer.set($event)"></ui-input>
      <div data-testid="structured-submit"><ui-button variant="primary" [loading]="saving()" (clicked)="submitStructured()">Guardar pregunta</ui-button></div>
    </div>
  }
</div>
