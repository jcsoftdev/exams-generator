<section class="mx-auto max-w-2xl p-6">
  <h1 class="mb-1 text-xl font-semibold text-n900">Subir pregunta</h1>
  <p class="mb-5 text-sm text-n600">Sube la foto del enunciado y clasifícala para tu banco.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 rounded-card border border-n200 bg-surface p-5">
    <label class="text-sm font-medium text-n700">
      Grado
      <select
        name="gradeLevel"
        formControlName="gradeLevel"
        class="mt-1 block w-full rounded-field border border-n200 bg-surface px-3 py-2 text-sm text-n900 focus:border-primary-400 focus:outline-none"
      >
        <option value="">Selecciona...</option>
        @for (gradeLevel of gradeLevels; track gradeLevel) {
          <option [value]="gradeLevel">{{ gradeLevelLabels[gradeLevel] }}</option>
        }
      </select>
    </label>

    <label class="text-sm font-medium text-n700">
      Curso
      <select
        name="courseId"
        formControlName="courseId"
        class="mt-1 block w-full rounded-field border border-n200 bg-surface px-3 py-2 text-sm text-n900 focus:border-primary-400 focus:outline-none disabled:cursor-not-allowed disabled:bg-n50 disabled:text-n400"
      >
        <option value="">{{ form.controls.gradeLevel.value ? 'Selecciona...' : 'Elige un grado primero' }}</option>
        @for (course of courses(); track course.id) {
          <option [value]="course.id">{{ course.name }}</option>
        }
      </select>
    </label>

    <label class="text-sm font-medium text-n700">
      Tema
      <select
        name="topicId"
        formControlName="topicId"
        [disabled]="!form.controls.courseId.value"
        class="mt-1 block w-full rounded-field border border-n200 bg-surface px-3 py-2 text-sm text-n900 focus:border-primary-400 focus:outline-none disabled:cursor-not-allowed disabled:bg-n50 disabled:text-n400"
      >
        <option value="">Selecciona...</option>
        @for (topic of topics(); track topic.id) {
          <option [value]="topic.id">{{ topic.name }}</option>
        }
      </select>
    </label>

    <div class="grid gap-4 sm:grid-cols-2">
      <label class="text-sm font-medium text-n700">
        Nivel
        <select
          name="difficulty"
          formControlName="difficulty"
          class="mt-1 block w-full rounded-field border border-n200 bg-surface px-3 py-2 text-sm text-n900 focus:border-primary-400 focus:outline-none"
        >
          <option value="">Selecciona...</option>
          @for (difficulty of difficulties; track difficulty) {
            <option [value]="difficulty">{{ difficulty }}</option>
          }
        </select>
      </label>

      <label class="text-sm font-medium text-n700">
        Clave (respuesta correcta)
        <input
          type="text"
          name="correctAnswer"
          formControlName="correctAnswer"
          class="mt-1 block w-full rounded-field border border-n200 px-3 py-2 text-sm text-n900 placeholder:text-n400 focus:border-primary-400 focus:outline-none"
        />
      </label>
    </div>

    <div class="flex flex-col gap-2">
      <span class="text-sm font-medium text-n700">Imagen del enunciado</span>
      <label
        class="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-card border-2 border-dashed border-n300 bg-n50 px-4 py-6 text-center transition-colors hover:border-primary-400 hover:bg-primary-50"
      >
        <input type="file" name="image" accept="image/*" class="sr-only" (change)="onFileSelected($event)" />
        @if (selectedFile()) {
          <span class="text-sm font-medium text-n900">{{ selectedFile()!.name }}</span>
          <span class="text-sm font-medium text-primary-500">Cambiar imagen</span>
        } @else {
          <span class="text-sm text-n700">Arrastra una imagen o haz clic para elegirla</span>
          <span class="text-xs text-n500">PNG o JPG</span>
        }
      </label>
    </div>

    <button
      type="submit"
      [disabled]="submitting()"
      class="inline-flex items-center justify-center gap-2 rounded-field bg-primary-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-600 disabled:cursor-not-allowed disabled:opacity-60"
    >
      Subir
    </button>
  </form>

  @if (successMessage()) {
    <div class="mt-4 rounded-field bg-easy-bg px-4 py-3 text-sm text-easy-text" role="status">{{ successMessage() }}</div>
  }
  @if (errorMessage()) {
    <div class="mt-4 rounded-field bg-hard-bg px-4 py-3 text-sm text-hard-text" role="alert">{{ errorMessage() }}</div>
  }
</section>
