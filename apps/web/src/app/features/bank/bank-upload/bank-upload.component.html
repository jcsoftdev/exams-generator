<section class="bank-upload">
  <h1>Subir pregunta</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Curso
      <select name="courseId" formControlName="courseId">
        <option value="">Selecciona...</option>
        @for (course of courses(); track course.id) {
          <option [value]="course.id">{{ course.name }}</option>
        }
      </select>
    </label>
    <label>
      Tema
      <select name="topicId" formControlName="topicId" [disabled]="!form.controls.courseId.value">
        <option value="">Selecciona...</option>
        @for (topic of topics(); track topic.id) {
          <option [value]="topic.id">{{ topic.name }}</option>
        }
      </select>
    </label>
    <label>
      Dificultad
      <select name="difficulty" formControlName="difficulty">
        <option value="">Selecciona...</option>
        @for (difficulty of difficulties; track difficulty) {
          <option [value]="difficulty">{{ difficulty }}</option>
        }
      </select>
    </label>
    <label>
      Grado
      <select name="gradeLevel" formControlName="gradeLevel">
        <option value="">Selecciona...</option>
        @for (gradeLevel of gradeLevels; track gradeLevel) {
          <option [value]="gradeLevel">{{ gradeLevelLabels[gradeLevel] }}</option>
        }
      </select>
    </label>
    <label>
      Respuesta correcta
      <input type="text" name="correctAnswer" formControlName="correctAnswer" />
    </label>
    <label>
      Imagen
      <input type="file" name="image" accept="image/*" (change)="onFileSelected($event)" />
    </label>
    <button type="submit" [disabled]="submitting()">Subir</button>
  </form>

  @if (successMessage()) {
    <p class="bank-upload__success" role="status">{{ successMessage() }}</p>
  }
  @if (errorMessage()) {
    <p class="bank-upload__error" role="alert">{{ errorMessage() }}</p>
  }
</section>
