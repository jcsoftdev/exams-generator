<main class="login flex min-h-screen items-center justify-center bg-n50">
  <div class="w-full max-w-sm rounded-card border border-n200 bg-white p-6">
    <h1 class="mb-4 text-xl font-semibold text-n900">Iniciar sesión</h1>
    <form (submit)="onFormSubmit($event)" class="flex flex-col gap-4">
      <ui-input
        label="Correo electrónico"
        name="email"
        type="email"
        [value]="email()"
        (valueChange)="email.set($event)"
      ></ui-input>
      <ui-input
        label="Contraseña"
        name="password"
        type="password"
        [value]="password()"
        (valueChange)="password.set($event)"
      ></ui-input>

      @if (errorMessage()) {
        <p data-testid="login-error" class="rounded-field bg-hard-bg px-3 py-2 text-sm text-hard-text" role="alert">
          {{ errorMessage() }}
        </p>
      }

      <ui-button htmlType="submit" variant="primary" [loading]="submitting()">
        Iniciar sesión
      </ui-button>
    </form>
  </div>
</main>
