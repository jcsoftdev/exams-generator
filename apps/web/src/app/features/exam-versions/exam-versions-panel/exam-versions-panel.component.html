<section class="exam-versions-panel">
  <h1>Exam Versions</h1>

  <form [formGroup]="form" (ngSubmit)="generate()" class="exam-versions-panel__controls">
    <label>
      Number of versions
      <input type="number" name="versionCount" min="1" formControlName="versionCount" />
    </label>
    <button type="submit" [disabled]="loading()">Generate</button>
  </form>

  @if (errorMessage()) {
    <p class="exam-versions-panel__error" role="alert">{{ errorMessage() }}</p>
  }

  @if (loading()) {
    <p>Generating versions...</p>
  } @else {
    <ul class="exam-versions-panel__versions">
      @for (version of versions(); track version.code) {
        <li class="exam-versions-panel__version" data-testid="version-row">
          <span class="exam-versions-panel__code">Version {{ version.code }}</span>
          <a [href]="version.pdfUrl" download data-testid="version-pdf-link">Download exam PDF</a>
          <a [href]="version.answerSheetUrl" download data-testid="version-answer-link">
            Download answer key
          </a>
        </li>
      } @empty {
        <li>No versions generated yet.</li>
      }
    </ul>
  }
</section>
