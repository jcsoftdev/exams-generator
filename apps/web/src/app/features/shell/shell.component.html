<div class="flex h-screen bg-n50">
  <aside data-testid="shell-sidebar-desktop" class="hidden w-60 shrink-0 md:block">
    <ui-sidebar [groups]="navGroups()"></ui-sidebar>
  </aside>

  @if (mobileOpen()) {
    <div data-testid="shell-mobile-drawer" class="fixed inset-0 z-40 md:hidden">
      <button
        type="button"
        data-testid="shell-mobile-backdrop"
        aria-label="Cerrar menú"
        class="absolute inset-0 block w-full border-0 bg-primary-900/40 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-300"
        (click)="closeMobileMenu()"
      ></button>
      <div
        #drawerPanel
        class="relative h-full w-60"
        role="dialog"
        aria-modal="true"
        aria-label="Menú de navegación"
        tabindex="-1"
        (keydown.escape)="closeMobileMenu()"
        (keydown.tab)="onDrawerTab($event, false)"
        (keydown.shift.tab)="onDrawerTab($event, true)"
      >
        <ui-sidebar [groups]="navGroups()"></ui-sidebar>
      </div>
    </div>
  }

  <div #appColumn class="flex flex-1 flex-col overflow-hidden">
    <ui-topbar [title]="schoolName()" (menuToggle)="toggleMobileMenu()">
      <div actions class="flex items-center gap-2">
        <button
          type="button"
          data-testid="theme-toggle-button"
          class="relative flex h-8 w-8 items-center justify-center rounded-full text-n600 hover:bg-n100"
          [attr.aria-label]="
            themeMode() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'
          "
          (click)="toggleTheme()"
        >
          @if (themeMode() === 'dark') {
            <lucide-angular name="sun" class="h-5 w-5"></lucide-angular>
          } @else {
            <lucide-angular name="moon" class="h-5 w-5"></lucide-angular>
          }
        </button>
        <div class="relative">
          <button
            type="button"
            data-testid="user-menu-button"
            class="flex h-8 w-8 items-center justify-center rounded-full bg-primary-100 text-primary-700 hover:bg-primary-200"
            (click)="toggleUserMenu()"
            aria-label="Menú de usuario"
          >
            <lucide-angular name="user" class="h-5 w-5"></lucide-angular>
          </button>
          @if (userMenuOpen()) {
            <div
              class="absolute right-0 z-50 mt-2 w-64 rounded-card border border-n200 bg-surface py-1 shadow-lg"
            >
              @if (currentUser(); as user) {
                <div data-testid="user-menu-identity" class="border-b border-n200 px-3 py-2">
                  <p data-testid="user-menu-name" class="truncate text-sm font-medium text-n900">
                    {{ user.name || user.email }}
                  </p>
                  @if (user.name) {
                    <p data-testid="user-menu-email" class="truncate text-xs text-n500">
                      {{ user.email }}
                    </p>
                  }
                  <ui-tag data-testid="user-menu-role" variant="ai" class="mt-1 inline-block">{{
                    currentUserRoleLabel()
                  }}</ui-tag>
                </div>
              }
              <button
                type="button"
                data-testid="logout-button"
                class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-n800 hover:bg-n50"
                (click)="logout()"
              >
                <lucide-angular name="log-out" class="h-4 w-4"></lucide-angular>
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      </div>
    </ui-topbar>
    <main class="flex-1 overflow-auto p-4">
      <!--
        D3 (audit M12): single aria-live sink for LiveAnnouncerService, moved
        here from bank-list at merge (integration) so it mounts once app-wide
        instead of only while bank-list is routed. See LiveRegionComponent's
        doc.
      -->
      <ui-live-region></ui-live-region>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
