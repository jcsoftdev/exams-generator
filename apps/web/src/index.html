<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>GeneraExamen</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Private per-tenant app. robots.txt already blocks crawling; this meta
       backs up any fetch that happens anyway. Known limit: a crawl-blocked
       URL can still surface as a bare "no info" listing since the crawler
       never reads this tag — acceptable, every route sits behind auth. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body class="font-sans">
    <app-root></app-root>
  </body>
</html>
