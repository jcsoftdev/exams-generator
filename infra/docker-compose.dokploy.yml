# Infra services are named `exams-*`, NOT the bare `postgres`/`redis`/`minio`.
#
# Dokploy attaches every container that Traefik must route to the SHARED
# `dokploy-network`, alongside every other project on the host. Compose
# registers each service's bare name as a DNS alias on every network the
# container joins, so a bare `postgres` collides with any other project's
# `postgres` — and Docker's resolution between the two is not deterministic.
#
# That is not hypothetical: the moment `api` got its own domain
# (api.creaexamen.com) it joined dokploy-network, `postgres:5432` started
# resolving to an unrelated project's database, and every boot died with
# `password authentication failed for user "exams"` — the credentials were
# correct all along, the host was not. Project-unique names remove the
# ambiguity instead of relying on which network happens to answer first.
services:
  exams-postgres:
    networks: [exams-internal]
    image: postgres:17.2-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-exams}
      # No dev fallback in PRODUCTION (audit 2026-08-20 H4): the old
      # `:-exams` default meant a missing Dokploy env var silently booted
      # prod with the password published in this repo — on a Docker network
      # shared with unrelated projects. Same `:?` pattern as JWT_SECRET.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-exams_generator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-exams}"]
      interval: 5s
      timeout: 5s
      retries: 10

  exams-minio:
    networks: [exams-internal]
    # Pinned (audit 2026-08-20 M11): `latest` let any pull change the MinIO
    # version under prod's feet. This tag is the exact release the local
    # `minio/minio:latest` resolved to on 2026-08-20 — proven against the
    # existing data volume. Bump deliberately.
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      # Same reasoning as DB_PASSWORD above — `minioadmin` is the single
      # best-known default credential in existence.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  exams-redis:
    networks: [exams-internal]
    image: redis:7.4-bookworm
    restart: unless-stopped
    # `--requirepass` (audit 2026-08-20 H4): this container sits on the
    # shared dokploy-network — the header comment above documents actual
    # cross-project name resolution on that network, so an unauthenticated
    # Redis here is readable/writable by any co-hosted project.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    networks: [exams-internal, default]
    # ONE replica, and this line is the enforcement, not a default being
    # restated. Two API containers would break three things quietly rather
    # than loudly (audit 2026-08-20, M5): the SSE progress streams push from
    # in-process Subjects, so a browser connected to instance A never hears
    # about a job instance B is running; the ThrottlerModule counts in memory,
    # so every limit silently doubles; and the Typst preview cache and
    # `bucketEnsured` flag are per-process. Scaling out means moving those to
    # Redis pub/sub and shared storage FIRST — until then this stays at 1, and
    # anyone raising it should have to delete this comment to do it.
    deploy:
      replicas: 1
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    # Apply pending Drizzle migrations and (idempotently) seed the taxonomy
    # before starting the server, so a deploy always brings the DB in sync —
    # prod has no other migrate/seed step. Both are idempotent (drizzle's
    # journal + the seed's onConflictDoUpdate), and DATABASE_URL + the
    # drizzle/ folder are present in the built image.
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js && node dist/main.js"]
    restart: unless-stopped
    depends_on:
      exams-postgres:
        condition: service_healthy
      exams-minio:
        condition: service_healthy
      exams-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-exams}:${DB_PASSWORD:-exams}@exams-postgres:5432/${DB_NAME:-exams_generator}
      MINIO_ENDPOINT: exams-minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      REDIS_HOST: exams-redis
      REDIS_PORT: 6379
      # Consumed by resolveRedisConnection() (common/queue.env.ts) for every
      # Redis client: BullMQ, /health ping, login-exchange.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Not `:?`: an operator who has not set up scraping yet should still be
      # able to deploy. The API itself refuses to serve /metrics without it in
      # production, so "unset" fails closed rather than exposing the endpoint.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AI_MODEL: ${AI_MODEL}
      AI_VISION_MODEL: ${AI_VISION_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PORT: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    networks: [exams-internal, default]
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  landing:
    networks: [exams-internal, default]
    build:
      context: ..
      dockerfile: infra/Dockerfile.landing
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:

# Postgres, Redis and MinIO sit on a network of their own, and only `api`,
# `web` and `landing` also join `default` — the one Dokploy attaches to
# `dokploy-network` so Traefik can route to them (audit 2026-08-20, H4).
#
# The header of this file documents what the shared network already did once:
# a bare `postgres` resolved to an unrelated project's database. Renaming the
# services to `exams-*` removed the ambiguity; this removes the reachability.
# Nothing outside this project can open a socket to the database at all now,
# which is a different and stronger claim than "it has a password".
#
# `internal: true` also means no egress for those three, which is correct —
# none of them dials out. If it ever needs to (a backup shipper, say), that is
# a deliberate change, not something to discover by having it silently work.
#
# NOT YET VERIFIED ON A REAL DEPLOY, unlike the rest of this file: Dokploy
# attaches routed containers to `dokploy-network` itself, and how it treats a
# compose that declares its own networks is the one thing that cannot be
# checked from a laptop. ROLLBACK: delete this block and the six `networks:`
# lines above; everything returns to a single default network.
networks:
  exams-internal:
    driver: bridge
    internal: true
