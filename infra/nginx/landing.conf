server {
    # 8080, not 80: the runtime image is nginx-unprivileged, and a process
    # that is not root cannot bind a port below 1024. Dropping root is the
    # point (audit 2026-08-20, H5) — the port number is the consequence.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/javascript image/svg+xml application/xml text/xml;

    # Astro emits a branded dist/404.html; without this, unmatched paths get
    # nginx's bare default 404 page instead (status code was already correct).
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
