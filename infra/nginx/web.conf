server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/javascript image/svg+xml;

    # Proxy API calls to the NestJS container. The web app uses a same-origin
    # `/api` base (see apps/web environment + dev proxy.conf.json); the trailing
    # slash on proxy_pass strips the `/api` prefix so `/api/auth/login` ->
    # `http://api:3000/auth/login`. `api` resolves over the compose network.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF generation itself no longer runs in the request path (it is a
        # BullMQ job now), but the progress channel it replaced it with does:
        # the SSE endpoints (`/exams/:id/versions/jobs/:jobId/stream`,
        # `/ai/questions/jobs/:id/stream`) hold a connection open and only
        # write a frame per completed unit of work. nginx's 60s default
        # proxy_read_timeout measures the gap BETWEEN reads, so a single form
        # that takes longer than that to compile would kill the stream
        # mid-generation. Keep the raised timeout for that reason.
        proxy_read_timeout 120s;
    }

    # Angular SPA -- unmatched paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
