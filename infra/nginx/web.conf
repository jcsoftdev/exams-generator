server {
    # 8080, not 80: the runtime image is nginx-unprivileged, and a process
    # that is not root cannot bind a port below 1024. Dropping root is the
    # point (audit 2026-08-20, H5) — the port number is the consequence.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/javascript image/svg+xml;

    # Proxy API calls to the NestJS container. The web app uses a same-origin
    # `/api` base (see apps/web environment + dev proxy.conf.json); the trailing
    # slash on proxy_pass strips the `/api` prefix so `/api/auth/login` ->
    # `http://api:3000/auth/login`. `api` resolves over the compose network.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF generation itself no longer runs in the request path (it is a
        # BullMQ job now), but the progress channel it replaced it with does:
        # the SSE endpoints (`/exams/:id/versions/jobs/:jobId/stream`,
        # `/ai/questions/jobs/:id/stream`) hold a connection open and only
        # write a frame per completed unit of work. nginx's 60s default
        # proxy_read_timeout measures the gap BETWEEN reads, so a single form
        # that takes longer than that to compile would kill the stream
        # mid-generation. Keep the raised timeout for that reason.
        proxy_read_timeout 120s;
    }

    # --- Caching (docs/audit-2026-08-26-prod-latency.md §5.5) ---
    #
    # Nothing here emitted a single Cache-Control header. What production
    # showed was `cache-control: max-age=14400` on the main bundle — 4 hours,
    # injected by Cloudflare's default Browser Cache TTL because the origin
    # stayed silent. A content-hashed file deserves a year; index.html deserves
    # zero. Both were getting four hours.

    # index.html is the POINTER to the hashed bundles, so it is the one file
    # that must never be served stale — a cached index.html keeps sending
    # browsers to the previous deploy's chunk names, which 404 after cleanup.
    # `no-cache` means "store it, but revalidate every time", so the usual
    # response is a 304 rather than a re-download.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Angular's content-hashed build output (`main-NERWJ2X7.js`,
    # `styles-NO7ENWZY.css`, hashed media). The hash IS the version: the file
    # at a given name can never change, so a year and `immutable` are facts,
    # not optimism, and `immutable` additionally stops the revalidation
    # request browsers otherwise fire on reload.
    #
    # The 8+ character run before the extension is what distinguishes these
    # from everything shipped verbatim out of `public/` — `favicon.ico`,
    # `robots.txt`, `plus-jakarta-sans-400.woff2`. Those are NOT hashed, so
    # they must not match here, and they don't.
    #
    # `public`, unlike the API's `/assets/:id`: these are the same bytes for
    # everyone and Cloudflare caching them at the edge is the entire point.
    location ~* "-[0-9A-Za-z]{8,}\.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed static files from `public/`. Long, but NOT immutable and not a
    # year — swapping a font file reuses its name, so the cache has to be able
    # to let go of it eventually without a rename.
    location ~* "\.(?:woff2?|ttf|otf|ico)$" {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Angular SPA -- unmatched paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
