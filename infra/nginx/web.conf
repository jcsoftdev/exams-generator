server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/javascript image/svg+xml;

    # Proxy API calls to the NestJS container. The web app uses a same-origin
    # `/api` base (see apps/web environment + dev proxy.conf.json); the trailing
    # slash on proxy_pass strips the `/api` prefix so `/api/auth/login` ->
    # `http://api:3000/auth/login`. `api` resolves over the compose network.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exam PDF generation (POST /exams/:id/versions) is still synchronous
        # end-to-end (BullMQ migration tracked separately, see docs/audit-todo.md
        # P0) — nginx's 60s default proxy_read_timeout can cut off a slow
        # multi-version compile before the API responds. Raise it here until
        # generation moves out of the request path.
        proxy_read_timeout 120s;
    }

    # Angular SPA -- unmatched paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
